<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* __STYLES__ */
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Pencil Bridge</h1>
        <span id="status" class="badge disconnected">Disconnected</span>
      </header>
      <p id="detail">
        Start the local bridge service, then enter its pairing code.
      </p>
      <form id="pair-form">
        <label for="pair-code">Pairing code</label>
        <div class="row">
          <input
            id="pair-code"
            maxlength="6"
            autocomplete="off"
            placeholder="A1B2C3"
          />
          <button type="submit">Connect</button>
        </div>
      </form>
      <section id="actions" hidden>
        <div class="row">
          <input id="screen-query" placeholder="Search or id:Frbpv" />
          <button id="search-screens" type="button">Search</button>
        </div>
        <button id="screens" type="button">Read Pen screens</button>
        <button id="selection" type="button" class="secondary">
          Read Figma selection
        </button>
        <button id="preview-export" type="button" class="secondary">
          Preview selection for Pencil
        </button>
        <button id="plan-export" type="button" class="secondary">
          Plan export to Pencil
        </button>
        <button id="export-copy" type="button" disabled>
          Export copy to Pencil…
        </button>
        <div class="row">
          <input id="adopt-root-id" placeholder="Existing Pencil root ID" />
          <button id="adopt-copy" type="button" class="secondary" disabled>
            Adopt
          </button>
        </div>
        <button id="preview-sync" type="button" class="secondary" disabled>
          Preview mapped sync
        </button>
        <button id="apply-sync" type="button" disabled>
          Apply mapped changes…
        </button>
        <aside id="conflict-panel" class="conflict-panel" hidden>
          <strong>Both editors changed this design</strong>
          <p id="conflict-summary"></p>
          <div class="conflict-actions">
            <button id="keep-pencil" type="button">Keep Pencil</button>
            <button id="keep-figma" type="button" class="secondary">
              Keep Figma
            </button>
            <button id="cancel-conflict" type="button" class="quiet">
              Cancel
            </button>
          </div>
        </aside>
        <button id="write-test" type="button" class="secondary">
          Test reversible write
        </button>
      </section>
      <div id="screen-list" class="screen-list"></div>
      <pre id="output" aria-live="polite"></pre>
    </main>
    <script>
      /* __SCRIPT__ */
    </script>
  </body>
</html>
